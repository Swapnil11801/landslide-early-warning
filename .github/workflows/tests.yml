name: Parity tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Model + slope stability (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/tests/parity.test.mjs

  browser:
    name: All checks incl. terrain (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -m http.server 8000 -d web &
      - run: node web/tests/run-browser-tests.mjs http://localhost:8000/tests.html google-chrome
